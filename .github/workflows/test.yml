name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  # templates/reference.docx は pandoc 既定の雛形から作るため、手元と同じ版に固定する。
  # 版を上げるときは node scripts/make-reference-docx.ts で雛形を作り直してコミットする
  PANDOC_VERSION: 3.8.3

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install pandoc
        run: |
          deb="pandoc-${PANDOC_VERSION}-1-amd64.deb"
          curl -fsSL -o "$RUNNER_TEMP/$deb" "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/${deb}"
          sudo dpkg -i "$RUNNER_TEMP/$deb"
          pandoc --version | head -1

      - name: shellcheck
        run: shellcheck scripts/*.sh

      - name: node --test
        run: node --test scripts/*.test.ts
